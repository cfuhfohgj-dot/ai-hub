<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل برامج الذكاء الاصطناعي</title>
<meta name="description" content="دليل عربي بسيط لأشهر برامج وأدوات الذكاء الاصطناعي">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <nav><span class="logo">🤖 AI Hub</span><button id="theme" aria-label="تغيير المظهر">🌓</button></nav>
  <h1>دليلك لأقوى برامج <span class="grad">الذكاء الاصطناعي</span></h1>
  <p>أدوات للكتابة والصور والفيديو والبرمجة والمذاكرة، في مكان واحد.</p>
  <input id="q" type="search" placeholder="ابحث عن أداة...">
  <div class="chips" id="chips"></div>
</header>
<main>
  <section id="grid" class="grid"></section>
  <p id="empty" hidden>مفيش نتائج.</p>
</main>
<footer>صُنع بحب ❤️ • الأدوات والأسعار ممكن تتغير، راجع الموقع الرسمي لكل أداة.</footer>
<script src="app.js"></script>
</body>
</html>
